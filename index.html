<!DOCTYPE html>

<title>Yigit Adventure 2.0 - 10 Bölüm Edition</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{margin:0;background:#0d111a;overflow:hidden;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:linear-gradient(135deg, #101827 0%, #1f293d 100%);z-index:20;padding:25px 20px;text-align:center;overflow-y:auto}
#startScreen{justify-content:center}
.hidden{display:none !important}
.game-title{font-size:clamp(28px, 6vw, 54px);font-weight:900;color:#f1c40f;text-shadow:0 5px 0 #d35400, 0 10px 25px rgba(0,0,0,0.6);margin:0 0 6px 0;letter-spacing:2px}
.subtitle{color:#94a3b8;font-size:clamp(13px, 2.5vw, 17px);margin-bottom:20px}

.main-btn{padding:15px 42px;font-size:20px;font-weight:bold;color:white;background:linear-gradient(to bottom, #2ecc71, #27ae60);border:none;border-radius:50px;box-shadow:0 6px 0 #1e8449, 0 10px 20px rgba(0,0,0,0.4);cursor:pointer;transition:transform 0.1s, filter 0.2s}
.main-btn:hover{filter:brightness(1.1)}
.main-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1e8449}

.levels-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(175px, 1fr));gap:12px;width:100%;max-width:950px;margin:10px 0;padding-bottom:20px}
.level-card{background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);border-radius:16px;padding:15px;color:white;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(6px);position:relative;overflow:hidden}
.level-card:hover:not(.locked){transform:translateY(-4px);border-color:#f1c40f;background:rgba(255,255,255,0.12)}
.level-card.locked{opacity:0.4;cursor:not-allowed;border-color:rgba(255,255,255,0.03)}
.level-card h3{margin:0 0 4px 0;font-size:17px;color:#f1c40f}
.level-card p{margin:0 0 10px 0;font-size:11px;color:#cbd5e1}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold}
.easy{background:#27ae60} .medium{background:#e67e22} .hard{background:#c0392b} .expert{background:#8e44ad} .master{background:#e74c3c}

.back-btn{margin:10px 0 25px 0;padding:10px 25px;background:transparent;border:2px solid #64748b;color:#cbd5e1;border-radius:20px;font-size:14px;cursor:pointer;flex-shrink:0}
.back-btn:hover{background:rgba(255,255,255,0.1)}

.hud-btn{position:fixed;top:15px;right:15px;z-index:15;padding:8px 15px;background:rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.3);color:white;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}

.controls{position:fixed;bottom:25px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:10}
.btn-group-left{display:flex;gap:18px;pointer-events:auto}
.btn-group-right{display:flex;pointer-events:auto}
.btn{width:75px;height:75px;border-radius:50%;background:rgba(255,255,255,0.22);border:2px solid rgba(255,255,255,0.5);color:white;font-size:28px;font-weight:bold;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);box-shadow:0 6px 20px rgba(0,0,0,0.4);cursor:pointer}
.btn:active{background:rgba(255,255,255,0.45);transform:scale(0.93)}
@media (min-width: 1024px) {
  .controls { display: none; }
}

function resize(){
  W=canvas.width = window.innerWidth || 800;
  H=canvas.height = window.innerHeight || 450;
  scale = Math.max(0.75, H / 520);
}
window.addEventListener("resize", resize);
resize();

let audioCtx = null;
function playSound(freq,type,dur){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq*0.3,audioCtx.currentTime+dur);
    gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start();osc.stop(audioCtx.currentTime+dur);
  } catch(e){}
}

let highScore = 0;
let unlockedLevel = 0;
try {
  highScore = parseInt(localStorage.getItem("yigit_highscore")) || 0;
  unlockedLevel = parseInt(localStorage.getItem("yigit_unlocked")) || 0;
} catch(e){}

function saveData(){
  try {
    localStorage.setItem("yigit_highscore", highScore);
    localStorage.setItem("yigit_unlocked", unlockedLevel);
  } catch(e){}
}

let gameState = "MENU";
let currentLevelIdx = 0;
let activeLevel = LEVELS[0];

function showStartScreen(){
  gameState = "MENU";
  document.getElementById("startScreen").classList.remove("hidden");
  document.getElementById("levelScreen").classList.add("hidden");
  document.getElementById("hudMenuBtn").classList.add("hidden");
  document.getElementById("touchControls").classList.add("hidden");
  document.getElementById("menuHighScore").innerText = "🏆 En Yüksek Puan: " + highScore;
}

function openLevelSelect(){
  gameState = "LEVEL_SELECT";
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("levelScreen").classList.remove("hidden");
  document.getElementById("hudMenuBtn").classList.add("hidden");
  document.getElementById("touchControls").classList.add("hidden");
  
  let grid = document.getElementById("levelsGrid");
  grid.innerHTML = "";
  LEVELS.forEach((lvl, idx) => {
    let isLocked = idx > unlockedLevel;
    grid.innerHTML += `
      <div class="level-card ${isLocked ? 'locked' : ''}" onclick="${isLocked ? '' : `startLevel(${idx})`}">
        <h3>${lvl.name}</h3>
        <p>${isLocked ? '🔒 Kilidi açmak için önceki bölümü bitir!' : 'Maceraya başla.'}</p>
        <span class="badge ${lvl.type}">${lvl.badge}</span>
      </div>
    `;
  });
}

function startLevel(idx){
  currentLevelIdx = idx;
  activeLevel = LEVELS[idx];
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("levelScreen").classList.add("hidden");
  document.getElementById("hudMenuBtn").classList.remove("hidden");
  document.getElementById("touchControls").classList.remove("hidden");
  gameState = "PLAYING";
  resetGame();
  playSound(440, "sine", 0.15);
}

const keys={};
window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if([" ","arrowup","arrowleft","arrowright","w","a","d"].includes(e.key.toLowerCase()))e.preventDefault();
  if(e.key==="Enter" && gameState==="PLAYING" && (gameOver||won)){
    if(won && currentLevelIdx < LEVELS.length - 1) startLevel(currentLevelIdx + 1);
    else resetGame();
  }
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let mouseControl={left:false,right:false,jump:false};
canvas.addEventListener("mousedown",e=>{
  if(gameState!=="PLAYING")return;
  if(gameOver||won){
    if(won && currentLevelIdx < LEVELS.length - 1) startLevel(currentLevelIdx + 1);
    else resetGame();
    return;
  }
  const rectBox = canvas.getBoundingClientRect();
  const x = e.clientX - rectBox.left;
  const y = e.clientY - rectBox.top;
  if(y < canvas.clientHeight / 2){
    mouseControl.jump = true;
    setTimeout(()=>mouseControl.jump=false, 150);
  }
  if(x < canvas.clientWidth / 2) mouseControl.left = true;
  else mouseControl.right = true;
});
canvas.addEventListener("mouseup",()=>{mouseControl.left=false;mouseControl.right=false;});

function bindTouch(id,key){
  const el=document.getElementById(id);
  const start=e=>{
    e.preventDefault();keys[key]=true;
    if(gameState==="PLAYING" && (gameOver||won)){
      if(won && currentLevelIdx < LEVELS.length - 1) startLevel(currentLevelIdx + 1);
      else resetGame();
    }
  };
  const end=e=>{e.preventDefault();keys[key]=false;};
  if(el){
    el.addEventListener("touchstart",start,{passive:false});
    el.addEventListener("touchend",end,{passive:false});
    el.addEventListener("mousedown",start);
    el.addEventListener("mouseup",end);
  }
}
bindTouch("btnLeft","arrowleft");
bindTouch("btnRight","arrowright");
bindTouch("btnJump"," ");

let player = {x:100,y:100,vx:0,vy:0,w:32,h:48,onGround:false,dir:1,frame:0,invincible:0};
let camera=0, score=0, lives=3, gameOver=false, won=false, coins=[], enemies=[], particles=[];
const gravity=0.55;

function addParticles(x,y,color,count=5){
  for(let i=0;i<count;i++){
    particles.push({
      x,y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.7)*3,
      life:15+Math.random()*15, maxLife:30, color, size:2+Math.random()*3
    });
  }
}

function resetGame(){
  player={x:100,y:100,vx:0,vy:0,w:32,h:48,onGround:false,dir:1,frame:0,invincible:0};
  camera=0;score=0;lives=3;gameOver=false;won=false;
  particles=[];
  coins=[];
  for(let x=250;x<activeLevel.goalX-100;x+=170){
    coins.push({x,y:290-Math.sin(x)*35,taken:false});
  }
  enemies = activeLevel.enemies.map(e => ({
    x: e.x, y: 398, min: e.min, max: e.max, dir: 1, alive: true
  }));
}

function rect(x,y,w,h,c){
  ctx.fillStyle=c;ctx.fillRect(x,y,w,h);
}

function drawBackground(){
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,activeLevel.sky[0]);
  g.addColorStop(0.55,activeLevel.sky[1]);
  g.addColorStop(1,activeLevel.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  
  ctx.fillStyle=activeLevel.sun;
  ctx.beginPath();ctx.arc(W*.85,H*.18,40*scale,0,Math.PI*2);ctx.fill();
  
  if(activeLevel.dark){
    ctx.fillStyle="rgba(255,255,255,0.85)";
    for(let i=0;i<35;i++){
      ctx.fillRect(((i*137)%W), ((i*73)%(H*0.5)), 2*scale, 2*scale);
    }
  } else {
    for(let i=0;i<8;i++){
      let x=((i*260-camera*.2)%(W+300)+W+300)%(W+300)-120;
      let y=H*(.1+(i%3)*.08);
      ctx.fillStyle="rgba(255,255,255,0.7)";
      ctx.beginPath();
      ctx.arc(x,y,25*scale,0,Math.PI*2);
      ctx.arc(x+30*scale,y-12*scale,32*scale,0,Math.PI*2);
      ctx.arc(x+62*scale,y,24*scale,0,Math.PI*2);
      ctx.fill();
    }
  }
  
  for(let i=0;i<20;i++){
    let x=i*300*scale-camera*.4;
    ctx.fillStyle=i%2?activeLevel.hills[0]:activeLevel.hills[1];
    ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+160*scale,H*.42);ctx.lineTo(x+320*scale,H);ctx.fill();
  }
}

function drawPlayer(){
  if(!player) return;
  let x=player.x-camera,y=player.y;
  let run=Math.abs(player.vx)>.5&&player.onGround;
  let step=run?Math.sin(player.frame*.35)*5:0;
  
  if(player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) return;

  ctx.save();
  if(player.dir<0){ctx.translate(x+player.w,y);ctx.scale(-1,1);x=0;y=0}
  
  ctx.fillStyle="rgba(0,0,0,0.25)";ctx.beginPath();ctx.ellipse(x+16,y+46,14,4,0,0,Math.PI*2);ctx.fill();
  rect(x+3,y+39+step,12,8,"#2c3e50");
  rect(x+18,y+39-step,12,8,"#2c3e50");
  rect(x+7,y+29+step,8,13,"#2980b9");
  rect(x+19,y+29-step,8,13,"#2980b9");
  rect(x+5,y+16,22,15,"#e74c3c");
  rect(x+2,y+18,6,6,"#d35400");
  rect(x+1,y+21-step,6,10,"#f39c12");
  rect(x+27,y+21+step,6,10,"#f39c12");
  rect(x+12,y+12,9,6,"#f39c12");
  rect(x+6,y,20,16,"#f39c12");
  rect(x+19,y+5,3,4,"#24202a");
  rect(x+4,y-4,23,5,"#2e9c58");
  rect(x+9,y-8,14,4,"#2e9c58");
  ctx.restore();
}

function drawWorld(){
  for(const p of activeLevel.platforms){
    let x=p.x-camera;
    if(x+p.w<0||x>W/scale)continue;
    rect(x,p.y,p.w,p.h,activeLevel.groundBody);
    rect(x,p.y,p.w,12,activeLevel.groundTop);
    for(let a=0;a<p.w;a+=35)rect(x+a,p.y+16,22,4,"rgba(0,0,0,0.2)");
  }
  
  let fx=activeLevel.goalX-camera;
  rect(fx,260,8,170,"#bdc3c7");
  ctx.fillStyle="#e74c3c";
  ctx.beginPath();ctx.moveTo(fx+8,260);ctx.lineTo(fx+65,285);ctx.lineTo(fx+8,310);ctx.fill();

  for(const c of coins){
    if(c.taken)continue;
    let x=c.x-camera;
    let pulse=Math.sin(Date.now()*0.008)*3;
    ctx.fillStyle="#f1c40f";
    ctx.beginPath();ctx.ellipse(x,c.y+pulse,9,12,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#f39c12";
    ctx.beginPath();ctx.ellipse(x,c.y+pulse,5,8,0,0,Math.PI*2);ctx.fill();
  }
  
  for(const e of enemies){
    if(!e.alive)continue;
    let x=e.x-camera;
    rect(x,e.y,30,25,"#c0392b");
    rect(x+3,e.y-6,24,8,"#e74c3c");
    rect(x+5,e.y+6,5,6,"white"); rect(x+7,e.y+8,2,3,"black");
    rect(x+20,e.y+6,5,6,"white"); rect(x+22,e.y+8,2,3,"black");
    rect(x+3,e.y+22,8,6,"#78281f");
    rect(x+19,e.y+22,8,6,"#78281f");
  }

  for(let p of particles){
    p.x+=p.vx; p.y+=p.vy; p.life--;
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillRect(p.x-camera,p.y,p.size,p.size);
    ctx.globalAlpha=1.0;
  }
  particles=particles.filter(p=>p.life>0);
}

function update(){
  if(gameState!=="PLAYING" || gameOver || won)return;
  if(player.invincible > 0) player.invincible--;

  let left = keys["a"] || keys["arrowleft"] || mouseControl.left;
  let right = keys["d"] || keys["arrowright"] || mouseControl.right;
  let jump = keys[" "] || keys["w"] || keys["arrowup"] || mouseControl.jump;
  
  let targetVx=0;
  if(left){targetVx=-3.8;player.dir=-1;}
  if(right){targetVx=3.8;player.dir=1;}
  player.vx+=(targetVx-player.vx)*0.25;

  if(jump&&player.onGround){
    player.vy=-12.5;
    player.onGround=false;
    playSound(300,"sine",0.12);
    addParticles(player.x+16,player.y+48,"#ffffff",6);
    mouseControl.jump=false;
  }
  
  player.x+=player.vx;
  if(player.x<0)player.x=0;
  player.vy+=gravity;
  let oldY=player.y;
  player.y+=player.vy;
  player.onGround=false;
  
  for(const p of activeLevel.platforms){
    if(player.x+player.w>p.x&&player.x<p.x+p.w&&
       oldY+player.h<=p.y+6&&player.y+player.h>=p.y&&player.vy>=0){
      player.y=p.y-player.h;player.vy=0;player.onGround=true;
    }
  }
  if(Math.abs(player.vx)>0.5&&player.onGround && Math.random()<0.3){
    addParticles(player.x+16,player.y+48,activeLevel.groundTop,2);
  }
  player.frame++;
  
  for(const c of coins){
    if(!c.taken&&Math.abs(player.x+16-c.x)<24&&Math.abs(player.y+20-c.y)<32){
      c.taken=true;score+=10;
      playSound(700,"triangle",0.08);
      addParticles(c.x,c.y,"#f1c40f",8);
    }
  }
  
  for(const e of enemies){
    if(!e.alive)continue;
    e.x+=e.dir*activeLevel.enemySpeed;
    if(e.x<e.min||e.x>e.max)e.dir*=-1;
    if(player.x+player.w>e.x&&player.x<e.x+30&&player.y+player.h>e.y&&player.y<e.y+25){
      if(player.vy>1&&player.y+player.h<e.y+16){
        e.alive=false;player.vy=-8.5;score+=30;
        playSound(180,"square",0.15);
        addParticles(e.x+15,e.y+12,"#e74c3c",10);
      }else if(player.invincible === 0){
        lives--;
        player.invincible = 60;
        player.vy = -7;
        player.vx = player.dir * -3;
        playSound(120,"sawtooth",0.3);
        if(lives <= 0){
          gameOver = true;
          playSound(90,"sawtooth",0.5);
        }
      }
    }
  }
  
  if(player.y>600){
    lives = 0;
    gameOver = true;
    playSound(90,"sawtooth",0.5);
  }
  
  let targetCam=Math.max(0,player.x-(W/scale)*.35);
  camera+=(targetCam-camera)*0.12;
  
  if(player.x>=activeLevel.goalX-20){
    won=true;
    playSound(580,"sine",0.4);
    if(score > highScore){
      highScore = score;
    }
    if(currentLevelIdx >= unlockedLevel && currentLevelIdx < LEVELS.length - 1){
      unlockedLevel = currentLevelIdx + 1;
    }
    saveData();
  }
}

function drawUI(){
  if(gameState!=="PLAYING")return;
  ctx.fillStyle = activeLevel.dark ? "#ecf0f1" : "#1e293b";
  ctx.font="bold 20px Arial";
  ctx.fillText("⭐ PUAN: "+score,20,35);
  ctx.fillText("❤️ " + "❤️".repeat(Math.max(0, lives)),20,62);
  
  ctx.font="bold 14px Arial";
  ctx.fillText(activeLevel.name.toUpperCase(),20,88);
  
  if(gameOver||won){
    ctx.fillStyle="rgba(0,0,0,0.82)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.fillStyle="white";
    ctx.font="bold 32px Arial";
    let titleText = won ? (currentLevelIdx === LEVELS.length - 1 ? "👑 TÜM OYUNU BİTİRDİN!" : "🎉 HARİKA! BÖLÜM BİTTİ!") : "💀 OYUN BİTTİ!";
    ctx.fillText(titleText,W/2,H/2-30);
    ctx.font="18px Arial";
    ctx.fillStyle="#f1c40f";
    ctx.fillText("Toplam Skor: "+score,W/2,H/2+5);
    ctx.fillStyle="#cbd5e1";
    ctx.fillText("En Yüksek Skor: "+highScore,W/2,H/2+35);
    ctx.fillStyle="white";
    let msg = won && currentLevelIdx < LEVELS.length - 1
      ? "Sonraki bölüme geçmek için tıkla"
      : "Tekrar oynamak için tıkla";
    ctx.fillText(msg,W/2,H/2+75);
    ctx.textAlign="left";
  }
}

function loop(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  update();
  drawBackground();
  ctx.save();
  ctx.scale(scale,scale);
  drawWorld();
  drawPlayer();
  ctx.restore();
  drawUI();
  requestAnimationFrame(loop);
}

resetGame();
showStartScreen();
loop();
</script>
</body>
</html>
